# Builds one zip per chapter plus one zip of everything, and attaches them to a
# GitHub release. Run it by pushing a tag, for example:
#   git tag v1.0
#   git push origin v1.0
# The download page links to releases/latest/download/<name>.zip, so its links
# always point to the newest release and never need editing.
name: Release workbooks
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each chapter
        run: |
          mkdir -p dist
          for d in workbooks/ch*/; do
            ch=$(basename "$d")
            if ls "$d"*.xlsx >/dev/null 2>&1; then
              (cd "$d" && zip -q -X "../../dist/${ch}-workbooks.zip" *.xlsx)
            fi
          done
          (cd workbooks && zip -q -r -X ../dist/all-workbooks.zip . -i '*.xlsx')
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Workbooks $GITHUB_REF_NAME" --notes "See CHANGELOG.md for what changed."
